<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${device.name} + ' | SmartTech'">Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">SmartTech</a>
</div></nav>

<main class="container py-5">
    <a th:href="@{/}" class="text-decoration-none">← Volver al catálogo</a>
    <div class="row g-5 mt-1">
        <div class="col-md-5">
            <img th:src="${device.imageUrl}" class="img-fluid rounded shadow-sm detail-image" th:alt="${device.name}">
        </div>
        <div class="col-md-7">
            <span class="badge text-bg-primary" th:text="${device.type}"></span>
            <p class="text-primary fw-semibold mt-3 mb-1" th:text="${device.brand.name}"></p>
            <h1 th:text="${device.name}"></h1>
            <p class="lead" th:text="${device.description}"></p>
            <h3 th:text="'$ ' + ${#numbers.formatDecimal(device.price, 0, 'COMMA', 2, 'POINT')}"></h3>
            <hr>
            <div class="row g-3">
                <div class="col-sm-6"><strong>Fecha de lanzamiento</strong><br><span th:text="${device.releaseDate}"></span></div>
                <div class="col-sm-6"><strong>Procesador</strong><br><span th:text="${device.processor}"></span></div>
                <div class="col-sm-6"><strong>Memoria</strong><br><span th:text="${device.memory}"></span></div>
                <div class="col-sm-6"><strong>Almacenamiento</strong><br><span th:text="${device.storage}"></span></div>
                <div class="col-sm-6"><strong>Pantalla</strong><br><span th:text="${device.screen}"></span></div>
            </div>
        </div>
    </div>

    <section class="mt-5">
        <h2 class="h4">Opiniones de usuarios</h2>
        <div class="card card-body shadow-sm mb-4">
            <form th:action="@{/devices/{id}/comments(id=${device.id})}" th:object="${comment}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input class="form-control" th:field="*{author}" required maxlength="80">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Calificación</label>
                        <select class="form-select" th:field="*{rating}" required>
                            <option value="5">5 - Excelente</option><option value="4">4 - Muy bueno</option>
                            <option value="3">3 - Bueno</option><option value="2">2 - Regular</option><option value="1">1 - Bajo</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Comentario</label>
                        <textarea class="form-control" rows="3" th:field="*{content}" required maxlength="1000"></textarea>
                    </div>
                    <div class="col-12"><button class="btn btn-primary">Publicar opinión</button></div>
                </div>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(comments)}" class="alert alert-light border">Aún no hay opiniones.</div>
        <div class="list-group" th:each="c : ${comments}">
            <div class="list-group-item py-3">
                <div class="d-flex justify-content-between">
                    <strong th:text="${c.author}"></strong>
                    <span th:text="${'★'.repeat(c.rating)}"></span>
                </div>
                <p class="mb-1 mt-2" th:text="${c.content}"></p>
                <small class="text-secondary" th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
            </div>
        </div>
    </section>
</main>
</body>
</html>
