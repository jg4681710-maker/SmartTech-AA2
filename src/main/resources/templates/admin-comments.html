<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comentarios | SmartTech</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark admin-navbar">
    <div class="container">

        <span class="navbar-brand mb-0">
            SmartTech · Administración
        </span>

        <div class="admin-nav-actions">

            <a th:href="@{/admin/devices}"
               class="btn btn-outline-light admin-nav-btn">
                Dispositivos
            </a>

            <a th:href="@{/admin/brands}"
               class="btn btn-outline-light admin-nav-btn">
                Marcas
            </a>

            <a th:href="@{/admin/device-types}"
               class="btn btn-outline-light admin-nav-btn">
                Tipos
            </a>

            <a th:href="@{/admin/authors}"
               class="btn btn-outline-light admin-nav-btn">
                Autores
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="admin-logout-form">

                <button type="submit"
                        class="btn btn-outline-light admin-nav-btn admin-nav-btn-logout">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>
</nav>


<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="mb-0">
            Gestión de comentarios
        </h1>

        <a th:href="@{/admin/devices}"
           class="btn btn-secondary">
            Volver
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Autor</th>
                    <th>Comentario</th>
                    <th>Calificación</th>
                    <th>Dispositivo</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="comment : ${comments}">

                    <td th:text="${comment.id}">
                    </td>

                    <td th:text="${comment.author.name}">
                    </td>

                    <td th:text="${comment.content}">
                    </td>

                    <td th:text="${comment.rating}">
                    </td>

                    <td th:text="${comment.device.name}">
                    </td>

                    <td th:text="${comment.createdAt}">
                    </td>

                    <td>

                        <div class="admin-table-actions">

                            <a th:href="@{/admin/comments/edit/{id}(id=${comment.id})}"
                               class="btn btn-outline-primary btn-sm">
                                Editar
                            </a>

                            <a th:href="@{/admin/comments/delete/{id}(id=${comment.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este comentario?');">
                                Eliminar
                            </a>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
