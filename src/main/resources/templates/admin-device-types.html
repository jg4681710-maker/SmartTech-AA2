<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tipos de dispositivos | SmartTech</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SmartTech · Administración
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">
                Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gestión de tipos de dispositivos</h1>

        <div>
            <a th:href="@{/admin/devices}"
               class="btn btn-secondary">
                Volver
            </a>

            <a th:href="@{/admin/device-types/new}"
               class="btn btn-primary">
                Nuevo tipo
            </a>
        </div>
    </div>

    <div th:if="${param.error}"
         class="alert alert-warning">
        No se puede eliminar este tipo porque tiene dispositivos asociados.
    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="type : ${deviceTypes}">

                    <td th:text="${type.id}"></td>

                    <td th:text="${type.name}"></td>

                    <td>

                        <a th:href="@{/admin/device-types/edit/{id}(id=${type.id})}"
                           class="btn btn-outline-primary btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/admin/device-types/delete/{id}(id=${type.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('¿Desea eliminar este tipo de dispositivo?');">
                            Eliminar
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
