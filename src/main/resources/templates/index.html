<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartTech | Dispositivos inteligentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SmartTech</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/devices}">Administración</a>
    </div>
</nav>

<header class="hero">
    <div class="container py-5">
        <span class="badge text-bg-primary mb-3">CATÁLOGO TECNOLÓGICO</span>
        <h1 class="display-5 fw-bold">Encuentra tu próximo dispositivo inteligente</h1>
        <p class="lead">Consulta lanzamientos, especificaciones y opiniones en un solo lugar.</p>
    </div>
</header>

<main class="container py-4">
    <form class="card card-body shadow-sm mb-4" method="get" th:action="@{/}">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label">Buscar</label>
                <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Ej. Galaxy, iPhone, ThinkPad...">
            </div>
            <div class="col-md-3">
                <label class="form-label">Marca</label>
                <select class="form-select" name="brandId">
                    <option value="">Todas</option>
                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"
                            th:selected="${selectedBrand != null and selectedBrand == brand.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Tipo</label>
                <select class="form-select" name="type">
                    <option value="">Todos</option>
                    <option value="Celular" th:selected="${selectedType == 'Celular'}">Celular</option>
                    <option value="Portátil" th:selected="${selectedType == 'Portátil'}">Portátil</option>
                    <option value="Tablet" th:selected="${selectedType == 'Tablet'}">Tablet</option>
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button class="btn btn-primary w-100">Buscar</button>
            </div>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Últimos lanzamientos</h2>
        <span class="text-secondary" th:text="${devices.size()} + ' resultados'"></span>
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="device : ${devices}">
            <article class="card h-100 shadow-sm product-card">
                <img th:src="${device.imageUrl}" class="card-img-top product-image" th:alt="${device.name}">
                <div class="card-body d-flex flex-column">
                    <span class="small text-primary fw-semibold" th:text="${device.brand.name}"></span>
                    <h3 class="h5 mt-1" th:text="${device.name}"></h3>
                    <p class="small text-secondary mb-2" th:text="${device.type + ' · Lanzamiento: ' + device.releaseDate}"></p>
                    <p class="card-text" th:text="${device.description}"></p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <strong th:text="'$ ' + ${#numbers.formatDecimal(device.price, 0, 'COMMA', 2, 'POINT')}"></strong>
                        <a class="btn btn-dark btn-sm" th:href="@{/devices/{id}(id=${device.id})}">Ver detalle</a>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>
<footer class="bg-dark text-white py-4 mt-5">
    <div class="container small">SmartTech · Proyecto académico de Desarrollo de Software Web Back-end</div>
</footer>
</body>
</html>
