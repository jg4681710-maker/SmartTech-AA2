<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcas | SmartTech</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body><main class="container py-5">
<div class="d-flex justify-content-between"><h1 class="h3">Gestión de marcas</h1><a th:href="@{/admin/devices}" class="btn btn-secondary">Volver</a></div>
<form class="row g-2 my-4" th:action="@{/admin/brands/save}" th:object="${brand}" method="post">
<div class="col-md-8"><input class="form-control" th:field="*{name}" placeholder="Ej. Samsung" required></div>
<div class="col-md-4"><button class="btn btn-primary w-100">Agregar marca</button></div>
</form>
<ul class="list-group"><li class="list-group-item d-flex justify-content-between" th:each="b : ${brands}">
<span th:text="${b.name}"></span><a class="btn btn-sm btn-outline-danger" th:href="@{/admin/brands/delete/{id}(id=${b.id})}">Eliminar</a>
</li></ul></main></body></html>
