<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Marcas | SmartTech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="h3 mb-0">
            Gestión de marcas
        </h1>

        <div>

            <a th:href="@{/admin/devices}"
               class="btn btn-secondary me-2">
                Volver
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="d-inline">

                <button type="submit"
                        class="btn btn-outline-danger">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>


    <!-- Formulario para agregar o actualizar una marca -->

    <form class="row g-2 my-4"
          th:action="@{/admin/brands/save}"
          th:object="${brand}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="col-md-8">

            <input type="text"
                   id="name"
                   class="form-control"
                   th:field="*{name}"
                   placeholder="Ej. Samsung"
                   required>

        </div>

        <div class="col-md-4">

            <button type="submit"
                    class="btn btn-primary w-100"
                    th:text="${brand.id == null ? 'Agregar marca' : 'Actualizar marca'}">
                Agregar marca
            </button>

        </div>

    </form>


    <!-- Lista de marcas -->

    <ul class="list-group">

        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:each="b : ${brands}">

            <span th:text="${b.name}">
                Marca
            </span>

            <div>

                <a class="btn btn-sm btn-outline-primary me-2"
                   th:href="@{/admin/brands/edit/{id}(id=${b.id})}">
                    Editar
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/admin/brands/delete/{id}(id=${b.id})}"
                   onclick="return confirm('¿Eliminar marca?')">
                    Eliminar
                </a>

            </div>

        </li>

    </ul>

</main>

</body>

</html>
