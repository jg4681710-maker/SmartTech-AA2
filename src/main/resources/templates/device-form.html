<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario | SmartTech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<main class="container py-5">

    <h1 class="h3 mb-4">Registrar / editar dispositivo</h1>

    <form th:action="@{/admin/devices/save}"
          th:object="${device}"
          method="post"
          class="row g-3">

        <!-- ID -->
        <input type="hidden" th:field="*{id}">

        <!-- NOMBRE -->
        <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input class="form-control"
                   th:field="*{name}"
                   required>
        </div>

        <!-- MARCA -->
        <div class="col-md-3">
            <label class="form-label">Marca</label>

            <select class="form-select"
                    th:field="*{brand}"
                    required>

                <option value="">Seleccione</option>

                <option th:each="b : ${brands}"
                        th:value="${b.id}"
                        th:text="${b.name}">
                </option>

            </select>
        </div>

        <!-- TIPO -->
        <div class="col-md-3">
            <label class="form-label">Tipo</label>

            <select class="form-select"
                    th:field="*{type}"
                    required>

                <option value="Celular">Celular</option>
                <option value="Portátil">Portátil</option>
                <option value="Tablet">Tablet</option>

            </select>
        </div>

        <!-- FECHA DE LANZAMIENTO -->
        <div class="col-md-4">
    <label class="form-label">Fecha de lanzamiento</label>
    <input type="date"
           class="form-control"
           name="releaseDate"
           th:value="${device.releaseDate}"
           required>
    </div>

        <!-- PROCESADOR -->
        <div class="col-md-4">
            <label class="form-label">Procesador</label>

            <input class="form-control"
                   th:field="*{processor}"
                   required>
        </div>

        <!-- MEMORIA -->
        <div class="col-md-4">
            <label class="form-label">Memoria</label>

            <input class="form-control"
                   th:field="*{memory}"
                   required>
        </div>

        <!-- ALMACENAMIENTO -->
        <div class="col-md-4">
            <label class="form-label">Almacenamiento</label>

            <input class="form-control"
                   th:field="*{storage}"
                   required>
        </div>

        <!-- PANTALLA -->
        <div class="col-md-4">
            <label class="form-label">Pantalla</label>

            <input class="form-control"
                   th:field="*{screen}"
                   required>
        </div>

        <!-- PRECIO -->
        <div class="col-md-4">
            <label class="form-label">Precio</label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{price}"
                   required>
        </div>

        <!-- URL DE IMAGEN -->
        <div class="col-12">
            <label class="form-label">URL de imagen</label>

            <input class="form-control"
                   th:field="*{imageUrl}"
                   required>
        </div>

        <!-- DESCRIPCIÓN -->
        <div class="col-12">
            <label class="form-label">Descripción</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{description}"
                      required></textarea>
        </div>

        <!-- BOTONES -->
        <div class="col-12">

            <button type="submit"
                    class="btn btn-primary">
                Guardar
            </button>

            <a class="btn btn-secondary"
               th:href="@{/admin/devices}">
                Cancelar
            </a>

        </div>

    </form>

</main>

</body>
</html>
