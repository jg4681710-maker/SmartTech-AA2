<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Autor | SmartTech</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            SmartTech · Administración
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-outline-light">
                Cerrar sesión
            </button>
        </form>

    </div>
</nav>

<main class="container py-4">

    <h1 class="mb-4"
        th:text="${author.id == null
            ? 'Nuevo autor'
            : 'Editar autor'}">
    </h1>

    <form th:action="@{/admin/authors/save}"
          th:object="${author}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label for="name"
                   class="form-label">
                Nombre
            </label>

            <input type="text"
                   id="name"
                   class="form-control"
                   th:field="*{name}"
                   maxlength="80"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Guardar
        </button>

        <a th:href="@{/admin/authors}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</main>

</body>
</html>
