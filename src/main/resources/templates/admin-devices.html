<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración | SmartTech</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container">
<a class="navbar-brand" th:href="@{/}">SmartTech · Administración</a>
<div><a class="btn btn-outline-light btn-sm me-2" th:href="@{/admin/brands}">Marcas</a><a class="btn btn-primary btn-sm" th:href="@{/admin/devices/new}">Nuevo dispositivo</a></div>
</div></nav>
<main class="container py-4">
<h1 class="h3 mb-4">Gestión de dispositivos</h1>
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead><tr><th>Nombre</th><th>Marca</th><th>Tipo</th><th>Lanzamiento</th><th>Precio</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="d : ${devices}">
<td th:text="${d.name}"></td><td th:text="${d.brand.name}"></td><td th:text="${d.type}"></td>
<td th:text="${d.releaseDate}"></td><td th:text="${d.price}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/devices/edit/{id}(id=${d.id})}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{/admin/devices/delete/{id}(id=${d.id})}" onclick="return confirm('¿Eliminar dispositivo?')">Eliminar</a></td>
</tr></tbody>
</table></div>
</main>
</body></html>
