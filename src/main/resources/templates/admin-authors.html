<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Autores | SmartTech</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            SmartTech · Administración
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-outline-light">
                Cerrar sesión
            </button>
        </form>

    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Gestión de autores</h1>

        <div>

            <a th:href="@{/admin/comments}"
               class="btn btn-secondary">
                Volver
            </a>

            <a th:href="@{/admin/authors/new}"
               class="btn btn-primary">
                Nuevo autor
            </a>

        </div>

    </div>

    <div th:if="${param.error}"
         class="alert alert-warning">
        No se puede eliminar este autor porque tiene comentarios asociados.
    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="author : ${authors}">

                    <td th:text="${author.id}"></td>

                    <td th:text="${author.name}"></td>

                    <td>

                        <a th:href="@{/admin/authors/edit/{id}(id=${author.id})}"
                           class="btn btn-outline-primary btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/admin/authors/delete/{id}(id=${author.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('¿Desea eliminar este autor?');">
                            Eliminar
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
